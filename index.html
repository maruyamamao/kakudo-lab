<script type="module">

        FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

<style>

:root {
    --green: #00ea7f;
    --blue: #00c3ff;

    --yellow: #ffd43b;
    --dark: #111;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,

button,
select,
input {
    font-family: inherit;
}


/* =====================================
   CAMERA PAGE
===================================== */

#cameraPage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}


/* =====================================
   CAMERA
===================================== */

#camera-container {
    position: relative;
    width: 100%;
    height: 62vh;
    min-height: 430px;
    background: #000;
    overflow: hidden;
}

#webcam {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);

/* =====================================
   FACE LANDMARK CANVAS
===================================== */

#faceCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}


/* =====================================
   FACE GUIDE
===================================== */

.face-guide {
    position: absolute;

    width: 190px;
    height: 250px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    border: 2px dashed rgba(255,255,255,0.7);

    pointer-events: none;
}

   AI CARD
===================================== */

#aiOverlay {
    position: absolute;

    left: 15px;
    right: 15px;

    z-index: 10;
}

.ai-card {
    background: rgba(0,0,0,0.78);

    backdrop-filter: blur(12px);

    border-radius: 15px;

    padding: 15px;

    border-left: 4px solid var(--green);
}

.ai-title {
    color: var(--green);

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 7px;
}

#realtimeAdvice {

===================================== */

   SCORE
===================================== */

.score-label {

}

#liveScore {

}


/* =====================================
   STATUS
===================================== */

.status {

    color: #000;
}


/* =====================================
   CONTROLS
===================================== */

#controls {
    position: relative;

    z-index: 20;

    background: white;

    color: #111;

    border-radius: 25px 25px 0 0;

    margin-top: -20px;

    padding: 20px;
}

.section-title {

@media(max-width:600px) {

<script type="module">


/* =================================================
   MEDIAPIPE
================================================= */

import {
    FaceLandmarker,
    FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =================================================
   ELEMENTS
================================================= */

const video =
    document.getElementById("webcam");

const faceCanvas =
    document.getElementById("faceCanvas");

const faceCtx =
    faceCanvas.getContext("2d");


/* =================================================
   VARIABLES
================================================= */

let faceLandmarker = null;

let lastVideoTime = -1;

let currentGoal = "none";

let currentYaw = 0;

let currentPitch = 0;

let currentScore = 0;


/* =================================================
   GOAL DATABASE
================================================= */

const goalDatabase = {

    chin: {

        name: "二重あご",

        idealYaw: 15,

        idealPitch: 5,

        advice:
            "📱 カメラを少し高くして、あごを軽く前に出してください。"

    },

    swelling: {

        name: "むくみ",

        idealYaw: 15,

        idealPitch: 5,

        advice:
            "💡 顔に正面から光が当たる位置で、少し斜めを向いてください。"

    },

    face: {

        name: "顔まわり",

        idealYaw: 15,

        idealPitch: 5,

        advice:
            "📐 顔を約15°横に向けると、輪郭がすっきり見えやすくなります。"

    },

    arms: {

        name: "二の腕",

        idealYaw: 30,

        idealPitch: 0,

        advice:
            "🙆 体を30°ほど斜めにして、腕を体から少し離してください。"

    },

    shoulder: {

        name: "肩幅",

        idealYaw: 30,

        idealPitch: 0,

        advice:
            "↗️ 体を30°ほど斜めにして、肩の力を抜いてください。"

    },

    stomach: {

        name: "おなか周り",

        idealYaw: 30,

        idealPitch: 0,

        advice:
            "📐 体を30〜45°ほど斜めにして、背筋を伸ばしてください。"

    },

    back: {

        name: "背中",

        idealYaw: 30,

        idealPitch: 0,

        advice:
            "↗️ 体を少し斜めにして、肩の力を抜いてください。"

    },

    legs: {

        name: "脚",

        idealYaw: 15,

        idealPitch: -5,

        advice:
            "⬇️ カメラを少し低くして、片足を前に出してください。"

    },

    full: {

        name: "全身",

        idealYaw: 30,

        idealPitch: 0,

        advice:
            "✨ 体を30°ほど斜めにして、背筋を伸ばしてください。"

    }

};


/* =================================================
   CAMERA
================================================= */

async function initCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject = stream;


        await video.play();


        await createFaceLandmarker();


        requestAnimationFrame(
            detectFace
        );


    } catch(error) {

        console.error(error);

        document.getElementById(
            "realtimeAdvice"
        ).innerHTML =
            "⚠️ カメラを使用できません。ブラウザのカメラ許可を確認してください。";

        document.getElementById(
            "status"
        ).innerText =
            "ERROR";

    }

}


/* =================================================
   FACE LANDMARK MODEL
================================================= */

async function createFaceLandmarker() {

    const filesetResolver =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    faceLandmarker =
        await FaceLandmarker.createFromOptions(

            filesetResolver,

            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate: "GPU"

                },

                runningMode: "VIDEO",

                numFaces: 1,

                minFaceDetectionConfidence: 0.5,

                minFacePresenceConfidence: 0.5,

                minTrackingConfidence: 0.5

            }

        );


}


/* =================================================
   FACE DETECTION
================================================= */

function detectFace() {

    if(
        !faceLandmarker ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            detectFace
        );

        return;

    }


    if(
        video.currentTime !==
        lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        const result =
            faceLandmarker.detectForVideo(

                video,

                performance.now()

            );


        processFace(result);

    }


    requestAnimationFrame(
        detectFace
    );

}


/* =================================================
   PROCESS FACE
================================================= */

function processFace(result) {

    faceCtx.clearRect(

        0,
        0,
        faceCanvas.width,
        faceCanvas.height

    );


    if(
        !result.faceLandmarks ||
        result.faceLandmarks.length === 0
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "NO FACE";


        document.getElementById(
            "realtimeAdvice"
        ).innerText =
            "👤 顔をカメラに映してください";


        document.getElementById(
            "liveScore"
        ).innerText =
            "--";


        return;

    }


    const landmarks =
        result.faceLandmarks[0];


    calculateFaceAngle(
        landmarks
    );


    calculateFacePosition(
        landmarks
    );


    calculateScore();


    updateRealtimeAdvice();

}


/* =================================================
   FACE ANGLE
================================================= */

function calculateFaceAngle(landmarks) {


    /*
        MediaPipeの顔ランドマークから
        左右方向の顔の向きを簡易推定
    */


    const nose =
        landmarks[1];

    const leftEye =
        landmarks[33];

    const rightEye =
        landmarks[263];


    const eyeCenterX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;


    const eyeDistance =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    let yaw =
        (
            nose.x -
            eyeCenterX
        ) /
        eyeDistance;


    /*
        正規化して角度へ変換
    */

    yaw =
        yaw * 70;


    /*
        上下方向
    */

    const eyeCenterY =
        (
            leftEye.y +
            rightEye.y
        ) / 2;


    const noseY =
        nose.y;


    let pitch =
        (
            noseY -
            eyeCenterY
        ) /
        eyeDistance;


    pitch =
        (pitch - 0.45) * 60;


    currentYaw =
        Math.round(yaw);


    currentPitch =
        Math.round(pitch);


    document.getElementById(
        "yaw"
    ).innerText =
        currentYaw + "°";


    document.getElementById(
        "pitch"
    ).innerText =
        currentPitch + "°";

}


/* =================================================
   FACE POSITION
================================================= */

function calculateFacePosition(
    landmarks
) {

    const nose =
        landmarks[1];


    let position;


    if(nose.x < 0.40) {

        position = "LEFT";

    }
    else if(nose.x > 0.60) {

        position = "RIGHT";

    }
    else {

        position = "CENTER";

    }


    document.getElementById(
        "facePosition"
    ).innerText =
        position;

}


/* =================================================
   SCORE
================================================= */

function calculateScore() {

    if(currentGoal === "none") {

        currentScore = 0;

        return;

    }


    const target =
        goalDatabase[currentGoal];


    const yawDifference =
        Math.abs(
            Math.abs(currentYaw) -
            target.idealYaw
        );


    const pitchDifference =
        Math.abs(
            currentPitch -
            target.idealPitch
        );


    let score =
        100;


    score -=
        yawDifference * 1.5;


    score -=
        pitchDifference * 1.2;


    /*
        顔が画面中央から外れすぎた場合
    */

    score =
        Math.max(
            40,
            Math.min(
                100,
                score
            )
        );


    currentScore =
        Math.round(score);


    document.getElementById(
        "liveScore"
    ).innerText =
        currentScore;


    document.getElementById(
        "score"
    ).innerText =
        currentScore;


    if(currentScore >= 90) {

        document.getElementById(
            "scoreMessage"
        ).innerText =
            "✨ PERFECT！この角度で撮影してみましょう。";

    }
    else if(currentScore >= 80) {

        document.getElementById(
            "scoreMessage"
        ).innerText =
            "👍 いい感じ！少し調整するとさらに良くなります。";

    }
    else {

        document.getElementById(
            "scoreMessage"
        ).innerText =
            "📐 AIのアドバイスに合わせて角度を調整してください。";

    }

}


/* =================================================
   REALTIME ADVICE
================================================= */

function updateRealtimeAdvice() {

    if(currentGoal === "none") {

        document.getElementById(
            "status"
        ).innerText =
            "SELECT MODE";

        document.getElementById(
            "realtimeAdvice"
        ).innerText =
            "気になるところを選択してください";

        return;

    }


    const target =
        goalDatabase[currentGoal];


    const yawDifference =
        Math.abs(
            Math.abs(currentYaw) -
            target.idealYaw
        );


    let message = "";


    if(currentScore >= 90) {

        message =
            "✨ PERFECT ANGLE！このまま撮影できます";


        document.getElementById(
            "status"
        ).innerText =
            "OPTIMAL";

    }

    else if(
        Math.abs(currentYaw) <
        target.idealYaw - 5
    ) {

        message =
            "↗️ もう少し体・顔を横に向けてください";


        document.getElementById(
            "status"
        ).innerText =
            "ADJUST";

    }

    else if(
        Math.abs(currentYaw) >
        target.idealYaw + 5
    ) {

        message =
            "↩️ 少し正面に戻してください";


        document.getElementById(
            "status"
        ).innerText =
            "ADJUST";

    }

    else if(
        currentPitch >
        target.idealPitch + 7
    ) {

        message =
            "⬇️ 顔を少し下に向けてください";


        document.getElementById(
            "status"
        ).innerText =
            "ADJUST";

    }

    else if(
        currentPitch <
        target.idealPitch - 7
    ) {

        message =

    }

}

/* =================================================
   PHOTO
================================================= */

const originalCanvas =
    document.createElement(
        "canvas"
    );

const editCanvas =
    document.getElementById(
        "editCanvas"
    );

const editContext =
    editCanvas.getContext(
        "2d"
    );

let originalImage =
    null;


window.takePhoto =
function() {

    if(
        !video.videoWidth
    ) {

        alert(
            "カメラの準備ができていません。"
        );

        return;

    }


    originalCanvas.width =
        video.videoWidth;


    originalCanvas.height =
        video.videoHeight;


    const ctx =
        originalCanvas.getContext(
            "2d"
        );


    /*
        インカメラの左右反転を
        撮影画像にも適用
    */

    ctx.save();


    ctx.translate(
        originalCanvas.width,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        video,

        0,
        0,

        originalCanvas.width,
        originalCanvas.height

    );


    ctx.restore();


    originalImage =
        ctx.getImageData(

            0,
            0,

            originalCanvas.width,
            originalCanvas.height

        );


    editCanvas.width =
        originalCanvas.width;


    editCanvas.height =
        originalCanvas.height;


    document.getElementById(
        "cameraPage"
    ).style.display =
        "none";


    document.getElementById(
        "editPage"
    ).style.display =
        "block";


    applyEdit();

};


/* =================================================
   EDIT
================================================= */

window.applyEdit =
function() {

    if(!originalImage)
        return;


    const brightness =
        Number(
            document.getElementById(
                "brightness"
            ).value
        );


    const contrast =
        Number(
            document.getElementById(
                "contrast"
            ).value
        );


    const saturation =
        Number(
            document.getElementById(
                "saturation"
            ).value
        );


    const warmth =
        Number(
            document.getElementById(
                "warmth"
            ).value
        );


    const soft =
        Number(
            document.getElementById(
                "soft"
            ).value
        );


    document.getElementById(
        "brightnessValue"
    ).innerText =
        brightness + "%";


    document.getElementById(
        "contrastValue"
    ).innerText =
        contrast + "%";


    document.getElementById(
        "saturationValue"
    ).innerText =
        saturation + "%";


    document.getElementById(
        "warmthValue"
    ).innerText =
        warmth;


    document.getElementById(
        "softValue"
    ).innerText =
        soft + "%";


    const image =
        new ImageData(

            new Uint8ClampedArray(
                originalImage.data
            ),

            originalImage.width,

            originalImage.height

        );


    const data =
        image.data;


    /*
        コントラスト
    */

    const contrastFactor =
        (259 *
            (contrast + 255)) /
        (255 *
            (259 - contrast));


    /*
        彩度
    */

    const saturationFactor =
        saturation / 100;


    for(
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let r =
            data[i];

        let g =
            data[i + 1];

        let b =
            data[i + 2];


        /*
            明るさ
        */

        r *=
            brightness / 100;

        g *=
            brightness / 100;

        b *=
            brightness / 100;


        /*
            コントラスト
        */

        r =
            contrastFactor *
            (r - 128) +
            128;

        g =
            contrastFactor *
            (g - 128) +
            128;

        b =
            contrastFactor *
            (b - 128) +
            128;


        /*
            彩度
        */

        const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        r =
            gray +
            (r - gray) *
            saturationFactor;

        g =
            gray +
            (g - gray) *
            saturationFactor;

        b =
            gray +
            (b - gray) *
            saturationFactor;


        /*
            色温度
        */

        r +=
            warmth;

        b -=
            warmth;


        data[i] =
            clamp(r);

        data[i + 1] =
            clamp(g);

        data[i + 2] =
            clamp(b);

    }


    editContext.putImageData(
        image,
        0,
        0
    );


    /*
        ソフト加工
    */

    if(soft > 0) {

        editContext.save();


        editContext.globalAlpha =
            0.35;


        editContext.filter =
            `blur(${soft}px)`;


        editContext.drawImage(

            editCanvas,

            0,
            0

        );


        editContext.restore();

    }

};


function clamp(value) {

    return Math.max(
        0,
        Math.min(
            255,
            value
        )
    );

}
