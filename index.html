<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Advice Prototype</title>

    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        :root {
            --primary: #00ea7f;
            --bg: #121212;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Camera Container */
        #camera-container {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AI Overlay */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }

        .advice-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-badge {
            display: inline-block;
            background: var(--primary);
            color: black;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        /* Bottom Controls */
        #controls {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        .shutter-btn {
            width: 70px;
            height: 70px;
            background: white;
            border: 5px solid #ddd;
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-inner {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div id="camera-container">

        <video id="webcam" autoplay playsinline></video>

        <div id="overlay">

            <div id="advice-box" class="advice-card">

                <div class="status-badge" id="status-badge">
                    AI ANALYZING
                </div>

                <div id="advice-text">
                    Select a goal to start receiving AI posing advice...
                </div>

                <!-- リアルタイム角度・点数 -->
                <div id="realtime-info"
                     style="
                     margin-top:10px;
                     line-height:1.8;
                     display:none;
                     ">

                    📐 角度：
                    <span id="yaw-value">0</span>°

                    <br>

                    ↕️ 上下：
                    <span id="pitch-value">0</span>°

                    <br>

                    🎯 目標角度：
                    <span id="target-value">0</span>°

                    <br>

                    ⭐ リアルタイム点数：
                    <span id="live-score">--</span>点

                </div>

            </div>

        </div>

    </div>


    <div id="controls">

        <label style="font-weight: bold; font-size: 0.9rem;">
            WHAT IS YOUR GOAL?
        </label>

        <select id="goal-select" onchange="updateAdvice()">

            <option value="none">
                -- Select a Mode --
            </option>

            <option value="chin">
                二重あご
            </option>

            <option value="swelling">
                むくみ
            </option>

            <option value="face">
                顔まわり
            </option>

            <option value="arms">
                二の腕
            </option>

            <option value="shoulder">
                肩幅
            </option>

            <option value="stomach">
                おなか周り
            </option>

            <option value="back">
                背中
            </option>

            <option value="legs">
                脚
            </option>

            <option value="full">
                全身すっきり
            </option>

        </select>


        <div class="shutter-btn" onclick="takeBurstPhotos()">

            <div class="shutter-inner"></div>

        </div>

    </div>


    <!-- 撮影結果 -->

    <div id="result-screen"
         style="
         display:none;
         position:fixed;
         inset:0;
         z-index:999;
         background:rgba(0,0,0,0.92);
         color:white;
         flex-direction:column;
         align-items:center;
         justify-content:center;
         padding:20px;
         box-sizing:border-box;
         ">

        <div style="
             font-size:20px;
             font-weight:bold;
             margin-bottom:15px;
             ">
            📸 BEST SHOT
        </div>

        <img id="result-image"
             style="
             max-width:90%;
             max-height:60vh;
             border-radius:12px;
             object-fit:contain;
             ">

        <div id="result-score"
             style="
             font-size:30px;
             font-weight:bold;
             margin-top:15px;
             ">
            --点
        </div>

        <div id="result-detail"
             style="
             margin-top:8px;
             text-align:center;
             ">
        </div>

        <button onclick="closeResult()"
                style="
                margin-top:20px;
                padding:12px 30px;
                border:none;
                border-radius:10px;
                background:#00ea7f;
                color:black;
                font-weight:bold;
                cursor:pointer;
                ">
            閉じる
        </button>

    </div>


    <script>

        /*
        ==================================================
        基本設定
        ==================================================
        */

        const video =
            document.getElementById("webcam");

        const adviceText =
            document.getElementById("advice-text");

        const badge =
            document.getElementById("status-badge");

        const realtimeInfo =
            document.getElementById("realtime-info");


        let currentGoal = "none";

        let currentYaw = 0;

        let currentPitch = 0;

        let currentRoll = 0;

        let currentScore = 0;

        let faceDetected = false;

        let targetYaw = 0;

        let targetPitch = 0;

        let cameraStarted = false;


        /*
        ==================================================
        各モード
        ==================================================
        */

        const goalSettings = {

            chin: {
                targetYaw: 12,
                targetPitch: -4
            },

            swelling: {
                targetYaw: 10,
                targetPitch: -3
            },

            face: {
                targetYaw: 15,
                targetPitch: -5
            },

            arms: {
                targetYaw: 25,
                targetPitch: 0
            },

            shoulder: {
                targetYaw: 25,
                targetPitch: 0
            },

            stomach: {
                targetYaw: 30,
                targetPitch: 0
            },

            back: {
                targetYaw: 35,
                targetPitch: 0
            },

            legs: {
                targetYaw: 5,
                targetPitch: 0
            },

            full: {
                targetYaw: 25,
                targetPitch: 0
            }

        };


        /*
        ==================================================
        カメラ起動
        ==================================================
        */

        async function initCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user",
                            width: {
                                ideal: 1280
                            },
                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });

                video.srcObject = stream;

                cameraStarted = true;

                /*
                カメラが起動したら
                MediaPipeも開始
                */

                startFaceTracking();

            }

            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                adviceText.innerHTML =
                    "Camera error: Please allow camera access.";

            }

        }


        /*
        ==================================================
        MediaPipe Face Mesh
        ==================================================
        */

        const faceMesh =
            new FaceMesh({

                locateFile: function(file) {

                    return (
                        "https://cdn.jsdelivr.net/npm/" +
                        "@mediapipe/face_mesh/" +
                        file
                    );

                }

            });


        faceMesh.setOptions({

            maxNumFaces: 1,

            refineLandmarks: true,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });


        /*
        ==================================================
        Face Mesh 結果
        ==================================================
        */

        faceMesh.onResults(function(results) {

            if (
                !results.multiFaceLandmarks ||
                results.multiFaceLandmarks.length === 0
            ) {

                faceDetected = false;

                badge.innerHTML =
                    "FACE NOT FOUND";

                badge.style.background =
                    "#aaa";

                return;

            }


            faceDetected = true;

            const landmarks =
                results.multiFaceLandmarks[0];


            /*
            ここで毎フレーム
            顔の角度を計算
            */

            calculateHeadPose(
                landmarks
            );

        });


        /*
        ==================================================
        MediaPipe カメラ
        ==================================================
        */

        function startFaceTracking() {

            const mpCamera =
                new Camera(

                    video,

                    {

                        onFrame:
                        async function() {

                            await faceMesh.send({

                                image: video

                            });

                        },

                        width: 640,

                        height: 480

                    }

                );


            mpCamera.start();

        }


        /*
        ==================================================
        顔の角度計算
        ==================================================
        */

        function calculateHeadPose(
            landmarks
        ) {

            /*
            Face Meshの主要ポイント

            1   鼻
            33  左目
            263 右目
            61  左頬
            291 右頬
            152 あご
            */


            const nose =
                landmarks[1];

            const leftEye =
                landmarks[33];

            const rightEye =
                landmarks[263];

            const leftCheek =
                landmarks[61];

            const rightCheek =
                landmarks[291];

            const chin =
                landmarks[152];


            /*
            ------------------------------------------
            顔の横幅
            ------------------------------------------
            */

            const faceWidth =
                Math.abs(
                    rightCheek.x -
                    leftCheek.x
                );


            if (faceWidth < 0.001) {

                return;

            }


            /*
            ------------------------------------------
            顔の中心
            ------------------------------------------
            */

            const faceCenterX =
                (
                    leftCheek.x +
                    rightCheek.x
                ) / 2;


            const eyeCenterY =
                (
                    leftEye.y +
                    rightEye.y
                ) / 2;


            /*
            ------------------------------------------
            左右の顔向き
            ------------------------------------------
            */

            const noseOffset =
                nose.x -
                faceCenterX;


            const normalizedYaw =
                noseOffset /
                faceWidth;


            /*
            正規化された値を
            角度っぽい数値に変換
            */

            let yaw =
                normalizedYaw * 120;


            yaw =
                Math.max(
                    -45,
                    Math.min(
                        45,
                        yaw
                    )
                );


            /*
            ------------------------------------------
            上下の向き
            ------------------------------------------
            */

            const faceHeight =
                Math.abs(
                    chin.y -
                    eyeCenterY
                );


            if (faceHeight < 0.001) {

                return;

            }


            const noseVertical =
                (
                    nose.y -
                    eyeCenterY
                ) /
                faceHeight;


            let pitch =
                (
                    noseVertical -
                    0.30
                ) * 100;


            pitch =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        pitch
                    )
                );


            /*
            ------------------------------------------
            顔の傾き Roll
            ------------------------------------------
            */

            const dx =
                rightEye.x -
                leftEye.x;

            const dy =
                rightEye.y -
                leftEye.y;


            let roll =
                Math.atan2(
                    dy,
                    dx
                ) *
                180 /
                Math.PI;


            /*
            数値制限
            */

            roll =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        roll
                    )
                );


            /*
            ------------------------------------------
            急激な数字変化を抑える
            ------------------------------------------
            */

            currentYaw =
                smooth(
                    currentYaw,
                    yaw,
                    0.35
                );


            currentPitch =
                smooth(
                    currentPitch,
                    pitch,
                    0.35
                );


            currentRoll =
                smooth(
                    currentRoll,
                    roll,
                    0.35
                );


            /*
            ------------------------------------------
            リアルタイム表示
            ------------------------------------------
            */

            document.getElementById(
                "yaw-value"
            ).innerText =
                Math.round(currentYaw);


            document.getElementById(
                "pitch-value"
            ).innerText =
                Math.round(currentPitch);


            /*
            ここが重要。

            モード未選択でも
            角度自体はリアルタイム更新する。
            */

            if (currentGoal !== "none") {

                calculateScore();

            }

        }


        /*
        ==================================================
        数値を滑らかにする
        ==================================================
        */

        function smooth(
            oldValue,
            newValue,
            factor
        ) {

            return (
                oldValue +
                (
                    newValue -
                    oldValue
                ) * factor
            );

        }


        /*
        ==================================================
        モード変更
        ==================================================
        */

        function updateAdvice() {

            currentGoal =
                document.getElementById(
                    "goal-select"
                ).value;


            if (
                currentGoal === "none"
            ) {

                realtimeInfo.style.display =
                    "none";


                adviceText.innerHTML =
                    "Select a goal to start receiving AI posing advice...";


                badge.innerHTML =
                    "AI ANALYZING";


                badge.style.background =
                    "#00ea7f";


                document.getElementById(
                    "live-score"
                ).innerText =
                    "--";


                return;

            }


            /*
            リアルタイム情報を表示
            */

            realtimeInfo.style.display =
                "block";


            /*
            目標角度
            */

            targetYaw =
                goalSettings[
                    currentGoal
                ].targetYaw;


            targetPitch =
                goalSettings[
                    currentGoal
                ].targetPitch;


            document.getElementById(
                "target-value"
            ).innerText =
                targetYaw;


            /*
            最初のアドバイス
            */

            adviceText.innerHTML =
                "🤖 AI analyzing your angle...";


            badge.innerHTML =
                "AI ANALYZING";


            badge.style.background =
                "#00ea7f";


            /*
            現在の角度で即採点
            */

            if (faceDetected) {

                calculateScore();

            }

        }


        /*
        ==================================================
        リアルタイム採点
        ==================================================
        */

        function calculateScore() {

            if (
                currentGoal === "none"
            ) {

                return;

            }


            /*
            現在の目標
            */

            const setting =
                goalSettings[
                    currentGoal
                ];


            targetYaw =
                setting.targetYaw;


            targetPitch =
                setting.targetPitch;


            /*
            ------------------------------------------
            左右角度の差
            ------------------------------------------
            */

            const yawDifference =
                Math.abs(
                    Math.abs(currentYaw) -
                    Math.abs(targetYaw)
                );


            /*
            ------------------------------------------
            上下角度の差
            ------------------------------------------
            */

            const pitchDifference =
                Math.abs(
                    currentPitch -
                    targetPitch
                );


            /*
            ------------------------------------------
            点数計算
            ------------------------------------------
            */

            let score =
                100 -
                (
                    yawDifference * 2
                ) -
                (
                    pitchDifference * 1
                );


            /*
            0～100点
            */

            score =
                Math.max(
                    0,
                    Math.min(
                        100,
                        score
                    )
                );


            currentScore =
                Math.round(score);


            /*
            ------------------------------------------
            表示
            ------------------------------------------
            */

            document.getElementById(
                "live-score"
            ).innerText =
                currentScore;


            /*
            ------------------------------------------
            リアルタイムアドバイス
            ------------------------------------------
            */

            const signedYaw =
                currentYaw;


            /*
            目標角度より
            左方向に足りない
            */

            if (
                Math.abs(signedYaw) <
                Math.abs(targetYaw) - 4
            ) {

                adviceText.innerHTML =
                    "↗️ もう少し横を向いてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            /*
            目標を超えた
            */

            else if (
                Math.abs(signedYaw) >
                Math.abs(targetYaw) + 4
            ) {

                adviceText.innerHTML =
                    "↙️ 少し正面に戻してください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            /*
            上下が低い
            */

            else if (
                currentPitch <
                targetPitch - 4
            ) {

                adviceText.innerHTML =
                    "⬆️ もう少し顔を上げてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            /*
            上下が高い
            */

            else if (
                currentPitch >
                targetPitch + 4
            ) {

                adviceText.innerHTML =
                    "⬇️ もう少し顔を下げてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            /*
            完成
            */

            else {

                adviceText.innerHTML =
                    "✨ PERFECT！この角度をキープ！";

                badge.innerHTML =
                    "READY / OPTIMAL";

                badge.style.background =
                    "#00c3ff";

            }

        }


        /*
        ==================================================
        3枚連射
        ==================================================
        */

        async function takeBurstPhotos() {

            if (
                currentGoal === "none"
            ) {

                alert(
                    "先に撮影したい項目を選択してください。"
                );

                return;

            }


            const photos = [];


            /*
            3枚撮影
            */

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                /*
                撮影時点の角度・点数を保存
                */

                const image =
                    capturePhoto();


                photos.push({

                    image:
                        image,

                    score:
                        currentScore,

                    yaw:
                        Math.round(
                            currentYaw
                        ),

                    pitch:
                        Math.round(
                            currentPitch
                        )

                });


                /*
                連射間隔
                */

                await sleep(500);

            }


            /*
            ==========================================
            一番点数の高い写真を選択
            ==========================================
            */

            photos.sort(
                function(a, b) {

                    return (
                        b.score -
                        a.score
                    );

                }
            );


            const best =
                photos[0];


            /*
            ==========================================
            結果表示
            ==========================================
            */

            document.getElementById(
                "result-image"
            ).src =
                best.image;


            document.getElementById(
                "result-score"
            ).innerText =
                best.score +
                "点";


            document.getElementById(
                "result-detail"
            ).innerHTML =
                `
                📐 角度：${best.yaw}°<br>
                ↕️ 上下：${best.pitch}°
                `;


            document.getElementById(
                "result-screen"
            ).style.display =
                "flex";

        }


        /*
        ==================================================
        写真撮影
        ==================================================
        */

        function capturePhoto() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                video.videoWidth ||
                1280;


            canvas.height =
                video.videoHeight ||
                720;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
            インカメラなので
            左右反転
            */

            ctx.translate(
                canvas.width,
                0
            );


            ctx.scale(
                -1,
                1
            );


            ctx.drawImage(

                video,

                0,

                0,

                canvas.width,

                canvas.height

            );


            return canvas.toDataURL(
                "image/jpeg",
                0.9
            );

        }


        /*
        ==================================================
        待機
        ==================================================
        */

        function sleep(ms) {

            return new Promise(
                function(resolve) {

                    setTimeout(
                        resolve,
                        ms
                    );

                }
            );

        }


        /*
        ==================================================
        結果画面を閉じる
        ==================================================
        */

        function closeResult() {

            document.getElementById(
                "result-screen"
            ).style.display =
                "none";

        }


        /*
        ==================================================
        起動
        ==================================================
        */

        initCamera();

    </script>

</body>
</html>
