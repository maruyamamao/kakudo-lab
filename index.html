<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Advice Prototype</title>

    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        :root {
            --primary: #00ea7f;
            --bg: #121212;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Camera Container */
        #camera-container {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AI Overlay */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }

        .advice-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-badge {
            display: inline-block;
            background: var(--primary);
            color: black;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        /* Bottom Controls */
        #controls {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        .shutter-btn {
            width: 70px;
            height: 70px;
            background: white;
            border: 5px solid #ddd;
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-inner {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 50%;
        }

        /* Angle information */
        #angle-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }

        #score-info {
            margin-top: 5px;
            font-weight: bold;
        }

        /* Result */
        #result {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #result img {
            max-width: 90%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
        }

        #result-score {
            font-size: 2rem;
            font-weight: bold;
            margin: 15px 0;
        }

        #close-result {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="camera-container">

        <video id="webcam" autoplay playsinline></video>

        <div id="overlay">

            <div id="advice-box" class="advice-card">

                <div class="status-badge">
                    AI ANALYZING
                </div>

                <div id="advice-text">
                    Select a goal to start receiving AI posing advice...
                </div>

            </div>

        </div>

        <!-- Real-time angle -->
        <div id="angle-info">

            <div>
                📐 現在の角度：
                <span id="current-angle">--</span>°
            </div>

            <div>
                🎯 目標角度：
                <span id="target-angle">--</span>°
            </div>

            <div id="direction-text">
                顔の向きを検出中...
            </div>

            <div id="score-info">
                ⭐ リアルタイム採点：
                <span id="live-score">--</span>点
            </div>

        </div>

    </div>


    <div id="controls">

        <label style="font-weight: bold; font-size: 0.9rem;">
            WHAT IS YOUR GOAL?
        </label>

        <select id="goal-select" onchange="updateAdvice()">

            <option value="none">
                -- Select a Mode --
            </option>

            <option value="chin">
                二重あご
            </option>

            <option value="swelling">
                むくみ
            </option>

            <option value="face">
                顔まわり
            </option>

            <option value="arms">
                二の腕
            </option>

            <option value="shoulder">
                肩幅
            </option>

            <option value="stomach">
                おなか周り
            </option>

            <option value="back">
                背中
            </option>

            <option value="legs">
                脚
            </option>

            <option value="full">
                全身すっきり
            </option>

        </select>


        <div class="shutter-btn" onclick="takeBurstPhotos()">

            <div class="shutter-inner"></div>

        </div>

    </div>


    <!-- Result -->

    <div id="result">

        <div style="font-size: 1.2rem; margin-bottom: 10px;">
            📸 BEST SHOT
        </div>

        <img id="result-image">

        <div id="result-score">
            --点
        </div>

        <div id="result-message">
            AIが写真を採点しました
        </div>

        <button id="close-result" onclick="closeResult()">
            閉じる
        </button>

    </div>


    <script>

        const video =
            document.getElementById("webcam");

        const adviceText =
            document.getElementById("advice-text");

        const badge =
            document.querySelector(".status-badge");


        let currentGoal = "none";

        let currentYaw = 0;

        let currentPitch = 0;

        let currentRoll = 0;

        let currentScore = 0;

        let targetYaw = 0;

        let targetPitch = 0;

        let step = 0;


        /*
         * 各モード
         */

        const goalSettings = {

            chin: {

                targetYaw: 15,

                targetPitch: -5,

                advice: [

                    "⬆️ カメラを少し高くしてください",

                    "👤 あごを少し前に出してください",

                    "📐 顔を少し横に向けてください",

                    "✅ 二重あごが目立ちにくい角度です！"

                ]

            },


            swelling: {

                targetYaw: 10,

                targetPitch: -3,

                advice: [

                    "💡 正面から光が当たる場所へ移動してください",

                    "📐 顔を少し斜めに向けてください",

                    "⬆️ カメラを目線より少し高くしてください",

                    "✨ 顔まわりがすっきり見える角度です！"

                ]

            },


            face: {

                targetYaw: 15,

                targetPitch: -5,

                advice: [

                    "📐 顔を15度ほど横に向けてください",

                    "⬆️ カメラを少し高くしてください",

                    "👤 あごを軽く引いてください",

                    "✅ 顔まわりがすっきり見える角度です！"

                ]

            },


            arms: {

                targetYaw: 30,

                targetPitch: 0,

                advice: [

                    "↗️ 体を30度ほど斜めにしてください",

                    "🙆 腕を体から少し離してください",

                    "📱 カメラを少し引いてください",

                    "✅ 二の腕がすっきり見えるポーズです！"

                ]

            },


            shoulder: {

                targetYaw: 25,

                targetPitch: 0,

                advice: [

                    "↗️ 体を少し斜めにしてください",

                    "🙆 肩の力を抜いてください",

                    "📐 カメラを少し斜めにしてください",

                    "✅ 肩幅がすっきり見える角度です！"

                ]

            },


            stomach: {

                targetYaw: 30,

                targetPitch: 0,

                advice: [

                    "↗️ 体を30度ほど斜めにしてください",

                    "🧍 背筋を伸ばしてください",

                    "👤 おなかを少し引いてください",

                    "✅ おなか周りがすっきり見えるポーズです！"

                ]

            },


            back: {

                targetYaw: 35,

                targetPitch: 0,

                advice: [

                    "↗️ 体を少し斜めにしてください",

                    "🧍 背筋を伸ばしてください",

                    "🙆 肩の力を抜いてください",

                    "✅ 背中のラインがすっきり見えるポーズです！"

                ]

            },


            legs: {

                targetYaw: 5,

                targetPitch: 0,

                advice: [

                    "⬇️ カメラを少し低くしてください",

                    "📱 カメラを少し離してください",

                    "🦵 片足を少し前に出してください",

                    "✨ 脚が長く見える角度です！"

                ]

            },


            full: {

                targetYaw: 30,

                targetPitch: 0,

                advice: [

                    "📱 カメラを少し離してください",

                    "↗️ 体を30度ほど斜めにしてください",

                    "🧍 背筋を伸ばしてください",

                    "✨ 全身がすっきり見えるポーズです！"

                ]

            }

        };


        /*
         * カメラ起動
         */

        async function initCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: "user",

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }

                        }

                    });

                video.srcObject = stream;

                startFaceTracking();

            }

            catch (err) {

                adviceText.innerHTML =
                    "Camera error: Please allow camera access.";

            }

        }


        /*
         * MediaPipe
         */

        const faceMesh =
            new FaceMesh({

                locateFile: function(file) {

                    return
                    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;

                }

            });


        faceMesh.setOptions({

            maxNumFaces: 1,

            refineLandmarks: true,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });


        /*
         * Face Mesh結果
         */

        faceMesh.onResults(function(results) {

            if (
                !results.multiFaceLandmarks ||
                results.multiFaceLandmarks.length === 0
            ) {

                return;

            }


            const landmarks =
                results.multiFaceLandmarks[0];


            calculateHeadPose(landmarks);

        });


        /*
         * カメラ → MediaPipe
         */

        function startFaceTracking() {

            const camera =
                new Camera(video, {

                    onFrame: async function() {

                        await faceMesh.send({

                            image: video

                        });

                    },

                    width: 640,

                    height: 480

                });


            camera.start();

        }


        /*
         * =========================================
         * 顔の向きを計算
         * =========================================
         *
         * 複数ランドマークを利用して
         * 顔の左右・上下・傾きを推定
         */

        function calculateHeadPose(landmarks) {

            /*
             * 使用するポイント
             *
             * 1     鼻
             * 33    左目
             * 263   右目
             * 61    左頬
             * 291   右頬
             * 152   あご
             */

            const nose =
                landmarks[1];

            const leftEye =
                landmarks[33];

            const rightEye =
                landmarks[263];

            const leftCheek =
                landmarks[61];

            const rightCheek =
                landmarks[291];

            const chin =
                landmarks[152];


            /*
             * 左右の目の中心
             */

            const eyeCenterX =
                (leftEye.x + rightEye.x) / 2;

            const eyeCenterY =
                (leftEye.y + rightEye.y) / 2;


            /*
             * 左右の頬の中心
             */

            const cheekCenterX =
                (leftCheek.x + rightCheek.x) / 2;


            /*
             * 顔の横幅
             */

            const faceWidth =
                Math.abs(
                    rightCheek.x -
                    leftCheek.x
                );


            if (faceWidth < 0.01) {

                return;

            }


            /*
             * ==========================
             * YAW
             * ==========================
             *
             * 鼻が顔の中心から
             * どちらにズレているか
             *
             * 目だけではなく頬も利用
             */

            const noseOffset =
                nose.x -
                cheekCenterX;


            let yawRatio =
                noseOffset /
                faceWidth;


            /*
             * 顔の回転角度へ変換
             */

            let yaw =
                yawRatio * 100;


            /*
             * -45 ～ +45
             */

            yaw =
                Math.max(
                    -45,
                    Math.min(
                        45,
                        yaw
                    )
                );


            /*
             * ==========================
             * PITCH
             * ==========================
             *
             * 鼻と目・あごの位置から
             * 上下方向を推定
             */

            const faceHeight =
                Math.abs(
                    chin.y -
                    eyeCenterY
                );


            let pitchRatio =
                (
                    nose.y -
                    eyeCenterY
                ) /
                faceHeight;


            let pitch =
                (
                    pitchRatio -
                    0.35
                ) * 100;


            pitch =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        pitch
                    )
                );


            /*
             * ==========================
             * ROLL
             * ==========================
             */

            const dx =
                rightEye.x -
                leftEye.x;

            const dy =
                rightEye.y -
                leftEye.y;


            let roll =
                Math.atan2(
                    dy,
                    dx
                ) *
                180 /
                Math.PI;


            roll =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        roll
                    )
                );


            /*
             * 平滑化
             *
             * 数値がガクガクしないようにする
             */

            currentYaw =
                smoothValue(
                    currentYaw,
                    yaw,
                    0.25
                );


            currentPitch =
                smoothValue(
                    currentPitch,
                    pitch,
                    0.25
                );


            currentRoll =
                smoothValue(
                    currentRoll,
                    roll,
                    0.25
                );


            /*
             * 整数化
             */

            currentYaw =
                Math.round(
                    currentYaw
                );

            currentPitch =
                Math.round(
                    currentPitch
                );

            currentRoll =
                Math.round(
                    currentRoll
                );


            /*
             * 表示
             */

            document.getElementById(
                "current-angle"
            ).innerText =
                currentYaw;


            /*
             * 選択中なら採点
             */

            if (currentGoal !== "none") {

                calculateRealtimeScore();

            }

        }


        /*
         * 数値を滑らかにする
         */

        function smoothValue(
            oldValue,
            newValue,
            amount
        ) {

            return (
                oldValue +
                (
                    newValue -
                    oldValue
                ) *
                amount
            );

        }


        /*
         * リアルタイム採点
         */

        function calculateRealtimeScore() {

            const setting =
                goalSettings[currentGoal];


            targetYaw =
                setting.targetYaw;

            targetPitch =
                setting.targetPitch;


            document.getElementById(
                "target-angle"
            ).innerText =
                targetYaw;


            /*
             * Yawの差
             */

            const yawDifference =
                Math.abs(
                    Math.abs(currentYaw) -
                    Math.abs(targetYaw)
                );


            /*
             * Pitchの差
             */

            const pitchDifference =
                Math.abs(
                    currentPitch -
                    targetPitch
                );


            /*
             * Yawを重視
             */

            let score =
                100 -
                yawDifference * 2 -
                pitchDifference * 0.8;


            /*
             * 0～100
             */

            score =
                Math.max(
                    0,
                    Math.min(
                        100,
                        score
                    )
                );


            currentScore =
                Math.round(score);


            /*
             * 表示
             */

            document.getElementById(
                "live-score"
            ).innerText =
                currentScore;


            /*
             * 方向アドバイス
             */

            updateDirection();


            /*
             * バッジ
             */

            if (currentScore >= 95) {

                badge.innerHTML =
                    "PERFECT ANGLE";

                badge.style.background =
                    "#00c3ff";

            }

            else if (currentScore >= 85) {

                badge.innerHTML =
                    "GOOD ANGLE";

                badge.style.background =
                    "#00ea7f";

            }

            else {

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

        }


        /*
         * リアルタイム方向指示
         */

        function updateDirection() {

            const direction =
                document.getElementById(
                    "direction-text"
                );


            const difference =
                Math.abs(currentYaw) -
                targetYaw;


            if (currentScore >= 95) {

                direction.innerHTML =
                    "✨ PERFECT！この角度をキープ！";

                return;

            }


            if (
                currentYaw < targetYaw - 3
            ) {

                direction.innerHTML =
                    "↗️ もう少し右を向いてください";

            }

            else if (
                currentYaw > targetYaw + 3
            ) {

                direction.innerHTML =
                    "↙️ もう少し左を向いてください";

            }

            else {

                direction.innerHTML =
                    "👍 角度はかなり良いです！";

            }

        }


        /*
         * モード変更
         */

        function updateAdvice() {

            currentGoal =
                document.getElementById(
                    "goal-select"
                ).value;


            step = 0;


            if (currentGoal === "none") {

                adviceText.innerHTML =
                    "Select a goal to start...";

                badge.style.background =
                    "#aaa";


                document.getElementById(
                    "angle-info"
                ).style.display =
                    "none";


                document.getElementById(
                    "live-score"
                ).innerText =
                    "--";


                return;

            }


            document.getElementById(
                "angle-info"
            ).style.display =
                "block";


            targetYaw =
                goalSettings[currentGoal].targetYaw;


            targetPitch =
                goalSettings[currentGoal].targetPitch;


            document.getElementById(
                "target-angle"
            ).innerText =
                targetYaw;


            showNextStep();

        }


        /*
         * AIアドバイス
         */

        function showNextStep() {

            const lines =
                goalSettings[currentGoal].advice;


            if (step < lines.length) {

                adviceText.innerHTML =
                    lines[step];


                badge.innerHTML =
                    "AI ADVICE";


                badge.style.background =
                    "#00ea7f";


                step++;


                setTimeout(
                    showNextStep,
                    3000
                );

            }

            else {

                badge.innerHTML =
                    "READY / OPTIMAL";

                badge.style.background =
                    "#00c3ff";

            }

        }


        /*
         * =========================================
         * 連射撮影
         * =========================================
         */

        async function takeBurstPhotos() {

            if (currentGoal === "none") {

                alert(
                    "先に撮影したい項目を選択してください。"
                );

                return;

            }


            const photos = [];


            /*
             * 3枚撮影
             */

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const photo =
                    capturePhoto();


                photos.push({

                    image: photo,

                    score: currentScore,

                    yaw: currentYaw,

                    pitch: currentPitch

                });


                await sleep(500);

            }


            /*
             * 点数の高い順
             */

            photos.sort(
                function(a, b) {

                    return b.score - a.score;

                }
            );


            const best =
                photos[0];


            /*
             * BEST SHOT表示
             */

            document.getElementById(
                "result-image"
            ).src =
                best.image;


            document.getElementById(
                "result-score"
            ).innerText =
                best.score + "点";


            if (best.score >= 95) {

                document.getElementById(
                    "result-message"
                ).innerText =
                    "✨ PERFECT！理想の角度です！";

            }

            else if (best.score >= 85) {

                document.getElementById(
                    "result-message"
                ).innerText =
                    "👍 とても良い写真です！";

            }

            else {

                document.getElementById(
                    "result-message"
                ).innerText =
                    "📐 もう少し角度を調整するとさらに良くなります。";

            }


            document.getElementById(
                "result"
            ).style.display =
                "flex";

        }


        /*
         * 写真撮影
         */

        function capturePhoto() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const ctx =
                canvas.getContext("2d");


            /*
             * 鏡と同じ左右反転
             */

            ctx.translate(
                canvas.width,
                0
            );

            ctx.scale(
                -1,
                1
            );


            ctx.drawImage(

                video,

                0,

                0,

                canvas.width,

                canvas.height

            );


            return canvas.toDataURL(

                "image/jpeg",

                0.9

            );

        }


        /*
         * 待機
         */

        function sleep(ms) {

            return new Promise(

                function(resolve) {

                    setTimeout(
                        resolve,
                        ms
                    );

                }

            );

        }


        /*
         * 結果を閉じる
         */

        function closeResult() {

            document.getElementById(
                "result"
            ).style.display =
                "none";

        }


        /*
         * 起動
         */

        initCamera();

    </script>

</body>
</html>
