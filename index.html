<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Advice Prototype</title>

    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        :root {
            --primary: #00ea7f;
            --bg: #121212;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Camera Container */
        #camera-container {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AI Overlay */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }

        .advice-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-badge {
            display: inline-block;
            background: var(--primary);
            color: black;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        /* Bottom Controls */
        #controls {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        .shutter-btn {
            width: 70px;
            height: 70px;
            background: white;
            border: 5px solid #ddd;
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-inner {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div id="camera-container">

        <video id="webcam" autoplay playsinline></video>

        <div id="overlay">

            <div id="advice-box" class="advice-card">

                <div class="status-badge">
                    AI ANALYZING
                </div>

                <div id="advice-text">
                    Select a goal to start receiving AI posing advice...
                </div>

                <!-- リアルタイム情報 -->
                <div id="realtime-info"
                     style="margin-top:10px; display:none;">

                    <div>
                        📐 角度：
                        <span id="yaw-value">0</span>°
                    </div>

                    <div>
                        ↕️ 上下：
                        <span id="pitch-value">0</span>°
                    </div>

                    <div>
                        🎯 目標：
                        <span id="target-value">0</span>°
                    </div>

                    <div>
                        ⭐ スコア：
                        <span id="live-score">--</span>点
                    </div>

                </div>

            </div>

        </div>

    </div>


    <div id="controls">

        <label style="font-weight: bold; font-size: 0.9rem;">
            WHAT IS YOUR GOAL?
        </label>


        <select id="goal-select" onchange="updateAdvice()">

            <option value="none">
                -- Select a Mode --
            </option>

            <option value="chin">
                二重あご
            </option>

            <option value="swelling">
                むくみ
            </option>

            <option value="face">
                顔まわり
            </option>

            <option value="arms">
                二の腕
            </option>

            <option value="shoulder">
                肩幅
            </option>

            <option value="stomach">
                おなか周り
            </option>

            <option value="back">
                背中
            </option>

            <option value="legs">
                脚
            </option>

            <option value="full">
                全身すっきり
            </option>

        </select>


        <div class="shutter-btn" onclick="takeBurstPhotos()">

            <div class="shutter-inner"></div>

        </div>

    </div>


    <!-- 撮影結果 -->

    <div id="result-screen"
         style="
         display:none;
         position:fixed;
         inset:0;
         z-index:999;
         background:rgba(0,0,0,0.92);
         color:white;
         flex-direction:column;
         align-items:center;
         justify-content:center;
         padding:20px;
         box-sizing:border-box;
         ">

        <div style="
             font-size:20px;
             font-weight:bold;
             margin-bottom:15px;
             ">
            📸 BEST SHOT
        </div>


        <img id="result-image"
             style="
             max-width:90%;
             max-height:60vh;
             border-radius:12px;
             object-fit:contain;
             ">


        <div id="result-score"
             style="
             font-size:30px;
             font-weight:bold;
             margin-top:15px;
             ">
            --点
        </div>


        <div id="result-detail"
             style="
             margin-top:8px;
             text-align:center;
             ">
        </div>


        <button onclick="closeResult()"
                style="
                margin-top:20px;
                padding:12px 30px;
                border:none;
                border-radius:10px;
                background:#00ea7f;
                color:black;
                font-weight:bold;
                cursor:pointer;
                ">
            閉じる
        </button>

    </div>


    <script>

        const video =
            document.getElementById("webcam");

        const adviceText =
            document.getElementById("advice-text");

        const badge =
            document.querySelector(".status-badge");


        let currentGoal = "none";

        let currentYaw = 0;

        let currentPitch = 0;

        let currentRoll = 0;

        let currentScore = 0;

        let targetYaw = 0;

        let targetPitch = 0;

        let adviceStep = 0;

        let faceDetected = false;


        /*
        ==========================================
        各モードの設定
        ==========================================
        */

        const goalSettings = {

            chin: {

                targetYaw: 15,

                targetPitch: -5,

                advice: [

                    "⬆️ カメラを少し高くしてください",

                    "👤 あごを少し前に出してください",

                    "📐 顔を少し横に向けてください",

                    "✅ 二重あごが目立ちにくい角度です！"

                ]

            },


            swelling: {

                targetYaw: 10,

                targetPitch: -3,

                advice: [

                    "💡 正面から光が当たる場所へ移動してください",

                    "📐 顔を少し斜めに向けてください",

                    "⬆️ カメラを目線より少し高くしてください",

                    "✨ 顔まわりがすっきり見える角度です！"

                ]

            },


            face: {

                targetYaw: 15,

                targetPitch: -5,

                advice: [

                    "📐 顔を15度ほど横に向けてください",

                    "⬆️ カメラを少し高くしてください",

                    "👤 あごを軽く引いてください",

                    "✅ 顔まわりがすっきり見える角度です！"

                ]

            },


            arms: {

                targetYaw: 30,

                targetPitch: 0,

                advice: [

                    "↗️ 体を30度ほど斜めにしてください",

                    "🙆 腕を体から少し離してください",

                    "📱 カメラを少し引いてください",

                    "✅ 二の腕がすっきり見えるポーズです！"

                ]

            },


            shoulder: {

                targetYaw: 25,

                targetPitch: 0,

                advice: [

                    "↗️ 体を少し斜めにしてください",

                    "🙆 肩の力を抜いてください",

                    "📐 カメラを少し斜めにしてください",

                    "✅ 肩幅がすっきり見える角度です！"

                ]

            },


            stomach: {

                targetYaw: 30,

                targetPitch: 0,

                advice: [

                    "↗️ 体を30度ほど斜めにしてください",

                    "🧍 背筋を伸ばしてください",

                    "👤 おなかを少し引いてください",

                    "✅ おなか周りがすっきり見えるポーズです！"

                ]

            },


            back: {

                targetYaw: 35,

                targetPitch: 0,

                advice: [

                    "↗️ 体を少し斜めにしてください",

                    "🧍 背筋を伸ばしてください",

                    "🙆 肩の力を抜いてください",

                    "✅ 背中のラインがすっきり見えるポーズです！"

                ]

            },


            legs: {

                targetYaw: 5,

                targetPitch: 0,

                advice: [

                    "⬇️ カメラを少し低くしてください",

                    "📱 カメラを少し離してください",

                    "🦵 片足を少し前に出してください",

                    "✨ 脚が長く見える角度です！"

                ]

            },


            full: {

                targetYaw: 30,

                targetPitch: 0,

                advice: [

                    "📱 カメラを少し離してください",

                    "↗️ 体を30度ほど斜めにしてください",

                    "🧍 背筋を伸ばしてください",

                    "✨ 全身がすっきり見えるポーズです！"

                ]

            }

        };


        /*
        ==========================================
        カメラ起動
        ==========================================
        */

        async function initCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: "user",

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }

                        }

                    });


                video.srcObject = stream;


                startFaceTracking();

            }

            catch (error) {

                adviceText.innerHTML =
                    "Camera error: Please allow camera access.";

                console.error(error);

            }

        }


        /*
        ==========================================
        MediaPipe Face Mesh
        ==========================================
        */

        const faceMesh =
            new FaceMesh({

                locateFile: function(file) {

                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;

                }

            });


        faceMesh.setOptions({

            maxNumFaces: 1,

            refineLandmarks: true,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });


        faceMesh.onResults(function(results) {

            if (
                !results.multiFaceLandmarks ||
                results.multiFaceLandmarks.length === 0
            ) {

                faceDetected = false;

                return;

            }


            faceDetected = true;


            const landmarks =
                results.multiFaceLandmarks[0];


            calculateHeadPose(landmarks);

        });


        /*
        ==========================================
        MediaPipeカメラ処理
        ==========================================
        */

        function startFaceTracking() {

            const camera =
                new Camera(video, {

                    onFrame: async function() {

                        await faceMesh.send({

                            image: video

                        });

                    },

                    width: 640,

                    height: 480

                });


            camera.start();

        }


        /*
        ==========================================
        顔の角度計算
        ==========================================
        */

        function calculateHeadPose(landmarks) {

            /*
            Face Mesh landmarks

            1   = 鼻
            33  = 左目
            263 = 右目
            61  = 左頬
            291 = 右頬
            152 = あご
            */


            const nose =
                landmarks[1];

            const leftEye =
                landmarks[33];

            const rightEye =
                landmarks[263];

            const leftCheek =
                landmarks[61];

            const rightCheek =
                landmarks[291];

            const chin =
                landmarks[152];


            /*
            --------------------------------------
            顔の横幅
            --------------------------------------
            */

            const faceWidth =
                Math.abs(
                    rightCheek.x -
                    leftCheek.x
                );


            if (faceWidth < 0.01) {

                return;

            }


            /*
            --------------------------------------
            顔の中心
            --------------------------------------
            */

            const faceCenterX =
                (
                    leftCheek.x +
                    rightCheek.x
                ) / 2;


            const eyeCenterY =
                (
                    leftEye.y +
                    rightEye.y
                ) / 2;


            /*
            ======================================
            YAW
            ======================================
            */

            const noseOffset =
                nose.x -
                faceCenterX;


            const normalizedYaw =
                noseOffset /
                faceWidth;


            /*
            係数を調整して
            実際の顔の向きに近い数値にする
            */

            let yaw =
                normalizedYaw * 140;


            /*
            範囲制限
            */

            yaw =
                Math.max(
                    -45,
                    Math.min(
                        45,
                        yaw
                    )
                );


            /*
            ======================================
            PITCH
            ======================================
            */

            const faceHeight =
                Math.abs(
                    chin.y -
                    eyeCenterY
                );


            if (faceHeight < 0.01) {

                return;

            }


            const noseVertical =
                (
                    nose.y -
                    eyeCenterY
                ) /
                faceHeight;


            let pitch =
                (
                    noseVertical -
                    0.32
                ) * 100;


            pitch =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        pitch
                    )
                );


            /*
            ======================================
            ROLL
            ======================================
            */

            const eyeDX =
                rightEye.x -
                leftEye.x;


            const eyeDY =
                rightEye.y -
                leftEye.y;


            let roll =
                Math.atan2(
                    eyeDY,
                    eyeDX
                ) *
                180 /
                Math.PI;


            roll =
                Math.max(
                    -30,
                    Math.min(
                        30,
                        roll
                    )
                );


            /*
            ======================================
            数値を滑らかにする
            ======================================
            */

            currentYaw =
                smooth(
                    currentYaw,
                    yaw,
                    0.30
                );


            currentPitch =
                smooth(
                    currentPitch,
                    pitch,
                    0.30
                );


            currentRoll =
                smooth(
                    currentRoll,
                    roll,
                    0.30
                );


            /*
            ======================================
            表示値
            ======================================
            */

            const displayYaw =
                Math.round(currentYaw);

            const displayPitch =
                Math.round(currentPitch);


            document.getElementById(
                "yaw-value"
            ).innerText =
                displayYaw;


            document.getElementById(
                "pitch-value"
            ).innerText =
                displayPitch;


            /*
            モード選択時
            */

            if (currentGoal !== "none") {

                calculateScore();

            }

        }


        /*
        ==========================================
        数値を滑らかにする
        ==========================================
        */

        function smooth(
            oldValue,
            newValue,
            factor
        ) {

            return (
                oldValue +
                (
                    newValue -
                    oldValue
                ) * factor
            );

        }


        /*
        ==========================================
        リアルタイム採点
        ==========================================
        */

        function calculateScore() {

            const setting =
                goalSettings[currentGoal];


            targetYaw =
                setting.targetYaw;


            targetPitch =
                setting.targetPitch;


            /*
            目標角度との差
            */

            const yawDifference =
                Math.abs(
                    Math.abs(currentYaw) -
                    Math.abs(targetYaw)
                );


            const pitchDifference =
                Math.abs(
                    currentPitch -
                    targetPitch
                );


            /*
            Yawを重視
            */

            let score =
                100 -
                (
                    yawDifference * 2
                ) -
                (
                    pitchDifference * 0.8
                );


            /*
            0～100
            */

            score =
                Math.max(
                    0,
                    Math.min(
                        100,
                        score
                    )
                );


            currentScore =
                Math.round(score);


            /*
            表示
            */

            document.getElementById(
                "target-value"
            ).innerText =
                targetYaw;


            document.getElementById(
                "live-score"
            ).innerText =
                currentScore;


            /*
            ======================================
            リアルタイムアドバイス
            ======================================
            */

            if (currentScore >= 95) {

                adviceText.innerHTML =
                    "✨ PERFECT！この角度をキープ！";

                badge.innerHTML =
                    "PERFECT ANGLE";

                badge.style.background =
                    "#00c3ff";

            }

            else if (
                currentYaw <
                targetYaw - 3
            ) {

                adviceText.innerHTML =
                    "↗️ もう少し右を向いてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            else if (
                currentYaw >
                targetYaw + 3
            ) {

                adviceText.innerHTML =
                    "↙️ もう少し左を向いてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            else if (
                currentPitch <
                targetPitch - 3
            ) {

                adviceText.innerHTML =
                    "⬆️ もう少し顔を上げてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            else if (
                currentPitch >
                targetPitch + 3
            ) {

                adviceText.innerHTML =
                    "⬇️ もう少し顔を下げてください";

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

            else {

                adviceText.innerHTML =
                    "👍 角度はかなり良いです！";

            }

        }


        /*
        ==========================================
        モード変更
        ==========================================
        */

        function updateAdvice() {

            currentGoal =
                document.getElementById(
                    "goal-select"
                ).value;


            adviceStep = 0;


            if (currentGoal === "none") {

                adviceText.innerHTML =
                    "Select a goal to start receiving AI posing advice...";


                badge.innerHTML =
                    "AI ANALYZING";


                badge.style.background =
                    "#00ea7f";


                document.getElementById(
                    "realtime-info"
                ).style.display =
                    "none";


                document.getElementById(
                    "live-score"
                ).innerText =
                    "--";


                return;

            }


            /*
            リアルタイム情報表示
            */

            document.getElementById(
                "realtime-info"
            ).style.display =
                "block";


            /*
            目標値
            */

            targetYaw =
                goalSettings[currentGoal].targetYaw;


            targetPitch =
                goalSettings[currentGoal].targetPitch;


            document.getElementById(
                "target-value"
            ).innerText =
                targetYaw;


            /*
            初期アドバイス
            */

            showNextAdvice();

        }


        /*
        ==========================================
        AIアドバイス
        ==========================================
        */

        function showNextAdvice() {

            /*
            リアルタイム角度が
            選択されている場合は
            リアルタイム表示を優先
            */

            if (currentGoal === "none") {

                return;

            }


            const lines =
                goalSettings[currentGoal].advice;


            if (
                adviceStep >=
                lines.length
            ) {

                adviceStep = 0;

            }


            /*
            リアルタイム判定が動いていない場合のみ
            */

            if (
                !faceDetected ||
                currentScore === 0
            ) {

                adviceText.innerHTML =
                    lines[adviceStep];

            }


            adviceStep++;


            setTimeout(
                showNextAdvice,
                4000
            );

        }


        /*
        ==========================================
        連射撮影
        ==========================================
        */

        async function takeBurstPhotos() {

            if (currentGoal === "none") {

                alert(
                    "先に撮影したい項目を選択してください。"
                );

                return;

            }


            /*
            顔が検出されていなくても
            撮影自体は可能
            */

            const photos = [];


            /*
            3枚連射
            */

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                /*
                撮影時点の値を保存
                */

                const photo =
                    capturePhoto();


                photos.push({

                    image:
                        photo,

                    score:
                        currentScore,

                    yaw:
                        Math.round(
                            currentYaw
                        ),

                    pitch:
                        Math.round(
                            currentPitch
                        )

                });


                /*
                少し間隔を空ける
                */

                await sleep(600);

            }


            /*
            ======================================
            点数の高い写真を選択
            ======================================
            */

            photos.sort(
                function(a, b) {

                    return b.score -
                           a.score;

                }
            );


            const best =
                photos[0];


            /*
            ======================================
            結果表示
            ======================================
            */

            document.getElementById(
                "result-image"
            ).src =
                best.image;


            document.getElementById(
                "result-score"
            ).innerText =
                best.score + "点";


            document.getElementById(
                "result-detail"
            ).innerHTML =
                `
                📐 角度：${best.yaw}°<br>
                ↕️ 上下：${best.pitch}°
                `;


            document.getElementById(
                "result-screen"
            ).style.display =
                "flex";

        }


        /*
        ==========================================
        写真を撮影
        ==========================================
        */

        function capturePhoto() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                video.videoWidth ||
                1280;


            canvas.height =
                video.videoHeight ||
                720;


            const ctx =
                canvas.getContext("2d");


            /*
            インカメラなので
            鏡のように左右反転
            */

            ctx.translate(
                canvas.width,
                0
            );


            ctx.scale(
                -1,
                1
            );


            ctx.drawImage(

                video,

                0,

                0,

                canvas.width,

                canvas.height

            );


            return canvas.toDataURL(
                "image/jpeg",
                0.9
            );

        }


        /*
        ==========================================
        待機
        ==========================================
        */

        function sleep(ms) {

            return new Promise(
                function(resolve) {

                    setTimeout(
                        resolve,
                        ms
                    );

                }
            );

        }


        /*
        ==========================================
        結果画面を閉じる
        ==========================================
        */

        function closeResult() {

            document.getElementById(
                "result-screen"
            ).style.display =
                "none";

        }


        /*
        ==========================================
        起動
        ==========================================
        */

        initCamera();

    </script>

</body>
</html>
