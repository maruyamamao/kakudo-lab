<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Advice Prototype</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        :root {
            --primary: #00ea7f;
            --bg: #121212;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Camera Container */
        #camera-container {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AI Overlay */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }

        .advice-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-badge {
            display: inline-block;
            background: var(--primary);
            color: black;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        /* Bottom Controls */
        #controls {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        .shutter-btn {
            width: 70px;
            height: 70px;
            background: white;
            border: 5px solid #ddd;
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-inner {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 50%;
        }

        /* リアルタイム角度表示 */
        #angle-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }

        #score-info {
            margin-top: 5px;
            font-weight: bold;
        }

        /* 撮影結果 */
        #result {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #result img {
            max-width: 90%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
        }

        #result-score {
            font-size: 2rem;
            font-weight: bold;
            margin: 15px 0;
        }

        #close-result {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="camera-container">

        <video id="webcam" autoplay playsinline></video>

        <div id="overlay">

            <div id="advice-box" class="advice-card">

                <div class="status-badge">
                    AI ANALYZING
                </div>

                <div id="advice-text">
                    Select a goal to start receiving AI posing advice...
                </div>

            </div>

        </div>

        <!-- リアルタイム角度・点数 -->
        <div id="angle-info">

            <div>
                📐 現在の角度：
                <span id="current-angle">--</span>°
            </div>

            <div>
                🎯 目標角度：
                <span id="target-angle">--</span>°
            </div>

            <div id="score-info">
                ⭐ リアルタイム採点：
                <span id="live-score">--</span>点
            </div>

        </div>

    </div>


    <div id="controls">

        <label style="font-weight: bold; font-size: 0.9rem;">
            WHAT IS YOUR GOAL?
        </label>

        <select id="goal-select" onchange="updateAdvice()">

            <option value="none">
                -- Select a Mode --
            </option>

            <option value="chin">
                二重あご
            </option>

            <option value="swelling">
                むくみ
            </option>

            <option value="face">
                顔まわり
            </option>

            <option value="arms">
                二の腕
            </option>

            <option value="shoulder">
                肩幅
            </option>

            <option value="stomach">
                おなか周り
            </option>

            <option value="back">
                背中
            </option>

            <option value="legs">
                脚
            </option>

            <option value="full">
                全身すっきり
            </option>

        </select>


        <div class="shutter-btn" onclick="takeBurstPhotos()">

            <div class="shutter-inner"></div>

        </div>

    </div>


    <!-- 撮影結果 -->

    <div id="result">

        <div style="font-size: 1.2rem; margin-bottom: 10px;">
            📸 BEST SHOT
        </div>

        <img id="result-image">

        <div id="result-score">
            --点
        </div>

        <div id="result-message">
            AIが写真を採点しました
        </div>

        <button id="close-result" onclick="closeResult()">
            閉じる
        </button>

    </div>


    <script>

        const video =
            document.getElementById('webcam');

        const adviceText =
            document.getElementById('advice-text');

        const badge =
            document.querySelector('.status-badge');


        let step = 0;

        let currentGoal = "none";

        let currentAngle = 0;

        let targetAngle = 0;

        let currentScore = 0;


        /*
         * 各モードの目標角度
         */

        const goalSettings = {

            chin: {
                target: 15,
                advice: [
                    "⬆️ カメラを少し高くしてください",
                    "👤 あごを少し前に出してください",
                    "📐 顔を少し上向きにしてください",
                    "✅ 二重あごが目立ちにくい角度です！"
                ]
            },

            swelling: {
                target: 10,
                advice: [
                    "💡 正面から光が当たる場所へ移動してください",
                    "📐 顔を少し斜めに向けてください",
                    "⬆️ カメラを目線より少し高くしてください",
                    "✨ 顔まわりがすっきり見える角度です！"
                ]
            },

            face: {
                target: 15,
                advice: [
                    "📐 顔を15度ほど横に向けてください",
                    "⬆️ カメラを少し高くしてください",
                    "👤 あごを軽く引いてください",
                    "✅ 顔まわりがすっきり見える角度です！"
                ]
            },

            arms: {
                target: 30,
                advice: [
                    "↗️ 体を30度ほど斜めにしてください",
                    "🙆 腕を体から少し離してください",
                    "📱 カメラを少し引いてください",
                    "✅ 二の腕がすっきり見えるポーズです！"
                ]
            },

            shoulder: {
                target: 25,
                advice: [
                    "↗️ 体を少し斜めにしてください",
                    "🙆 肩の力を抜いてください",
                    "📐 カメラを少し斜めにしてください",
                    "✅ 肩幅がすっきり見える角度です！"
                ]
            },

            stomach: {
                target: 30,
                advice: [
                    "↗️ 体を30度ほど斜めにしてください",
                    "🧍 背筋を伸ばしてください",
                    "👤 おなかを少し引いてください",
                    "✅ おなか周りがすっきり見えるポーズです！"
                ]
            },

            back: {
                target: 35,
                advice: [
                    "↗️ 体を少し斜めにしてください",
                    "🧍 背筋を伸ばしてください",
                    "🙆 肩の力を抜いてください",
                    "✅ 背中のラインがすっきり見えるポーズです！"
                ]
            },

            legs: {
                target: 5,
                advice: [
                    "⬇️ カメラを少し低くしてください",
                    "📱 カメラを少し離してください",
                    "🦵 片足を少し前に出してください",
                    "✨ 脚が長く見える角度です！"
                ]
            },

            full: {
                target: 30,
                advice: [
                    "📱 カメラを少し離してください",
                    "↗️ 体を30度ほど斜めにしてください",
                    "🧍 背筋を伸ばしてください",
                    "✨ 全身がすっきり見えるポーズです！"
                ]
            }

        };


        /*
         * Start Camera
         */

        async function initCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user"
                        }

                    });

                video.srcObject = stream;

                startFaceTracking();

            }

            catch (err) {

                adviceText.innerHTML =
                    "Camera error: Please allow camera access.";

            }

        }


        /*
         * MediaPipe Face Mesh
         */

        const faceMesh =
            new FaceMesh({

                locateFile: (file) => {

                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;

                }

            });


        faceMesh.setOptions({

            maxNumFaces: 1,

            refineLandmarks: true,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });


        /*
         * 顔を検出したとき
         */

        faceMesh.onResults((results) => {

            if (
                !results.multiFaceLandmarks ||
                results.multiFaceLandmarks.length === 0
            ) {

                return;

            }


            const landmarks =
                results.multiFaceLandmarks[0];


            calculateFaceAngle(landmarks);

        });


        /*
         * カメラ映像をFace Meshへ送る
         */

        function startFaceTracking() {

            const camera =
                new Camera(video, {

                    onFrame: async () => {

                        await faceMesh.send({
                            image: video
                        });

                    },

                    width: 640,

                    height: 480

                });


            camera.start();

        }


        /*
         * 顔の角度を簡易計算
         */

        function calculateFaceAngle(landmarks) {

            /*
             * 鼻
             */
            const nose =
                landmarks[1];


            /*
             * 左右の目
             */
            const leftEye =
                landmarks[33];

            const rightEye =
                landmarks[263];


            const eyeCenterX =
                (leftEye.x + rightEye.x) / 2;

            const eyeCenterY =
                (leftEye.y + rightEye.y) / 2;


            const eyeDistance =
                Math.abs(
                    rightEye.x - leftEye.x
                );


            if (eyeDistance === 0) {
                return;
            }


            /*
             * 鼻が目の中心から
             * どれだけ横にズレているか
             */

            let yawRatio =
                (nose.x - eyeCenterX)
                / eyeDistance;


            /*
             * 角度に変換
             */

            let angle =
                yawRatio * 90;


            /*
             * 数値が極端にならないようにする
             */

            angle =
                Math.max(
                    -45,
                    Math.min(
                        45,
                        angle
                    )
                );


            currentAngle =
                Math.round(angle);


            /*
             * 画面表示
             */

            document.getElementById(
                "current-angle"
            ).innerText =
                currentAngle;


            /*
             * 目標角度
             */

            if (currentGoal !== "none") {

                targetAngle =
                    goalSettings[currentGoal].target;

                document.getElementById(
                    "target-angle"
                ).innerText =
                    targetAngle;


                calculateScore();

            }

        }


        /*
         * リアルタイム採点
         */

        function calculateScore() {

            if (currentGoal === "none") {

                return;

            }


            const difference =
                Math.abs(
                    Math.abs(currentAngle)
                    - targetAngle
                );


            /*
             * 角度差が小さいほど高得点
             */

            let score =
                100 -
                difference * 2;


            score =
                Math.max(
                    40,
                    Math.min(
                        100,
                        score
                    )
                );


            currentScore =
                Math.round(score);


            document.getElementById(
                "live-score"
            ).innerText =
                currentScore;


            /*
             * 点数によってアドバイス
             */

            if (currentScore >= 95) {

                badge.innerHTML =
                    "PERFECT ANGLE";

                badge.style.background =
                    "#00c3ff";

            }

            else if (currentScore >= 85) {

                badge.innerHTML =
                    "GOOD ANGLE";

                badge.style.background =
                    "#00ea7f";

            }

            else {

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";

            }

        }


        /*
         * モード変更
         */

        function updateAdvice() {

            currentGoal =
                document.getElementById(
                    'goal-select'
                ).value;

            step = 0;


            if (currentGoal === "none") {

                adviceText.innerHTML =
                    "Select a goal to start...";

                badge.style.background =
                    "#aaa";

                document.getElementById(
                    "angle-info"
                ).style.display =
                    "none";

                document.getElementById(
                    "current-angle"
                ).innerText =
                    "--";

                document.getElementById(
                    "target-angle"
                ).innerText =
                    "--";

                document.getElementById(
                    "live-score"
                ).innerText =
                    "--";

                return;

            }


            /*
             * 角度情報を表示
             */

            document.getElementById(
                "angle-info"
            ).style.display =
                "block";


            targetAngle =
                goalSettings[currentGoal].target;


            document.getElementById(
                "target-angle"
            ).innerText =
                targetAngle;


            showNextStep();

        }


        /*
         * AIアドバイス
         */

        function showNextStep() {

            const lines =
                goalSettings[currentGoal].advice;


            if (step < lines.length) {

                adviceText.innerHTML =
                    lines[step];

                badge.innerHTML =
                    "AI ADVICE";

                badge.style.background =
                    "#00ea7f";


                step++;


                setTimeout(
                    showNextStep,
                    3000
                );

            }

            else {

                badge.innerHTML =
                    "READY / OPTIMAL";

                badge.style.background =
                    "#00c3ff";

            }

        }


        /*
         * 連射撮影
         *
         * 3枚撮影して、
         * 一番点数の高い写真を採用
         */

        async function takeBurstPhotos() {

            if (currentGoal === "none") {

                alert(
                    "先に撮影したい項目を選択してください。"
                );

                return;

            }


            const photos = [];


            /*
             * 連射開始
             */

            for (let i = 0; i < 3; i++) {

                const photo =
                    capturePhoto();


                photos.push({

                    image: photo,

                    score: currentScore,

                    angle: currentAngle

                });


                await sleep(400);

            }


            /*
             * 一番点数の高い写真を選択
             */

            photos.sort(
                (a, b) =>
                    b.score - a.score
            );


            const best =
                photos[0];


            /*
             * 結果表示
             */

            document.getElementById(
                "result-image"
            ).src =
                best.image;


            document.getElementById(
                "result-score"
            ).innerText =
                best.score + "点";


            if (best.score >= 95) {

                document.getElementById(
                    "result-message"
                ).innerText =
                    "✨ PERFECT！理想の角度です！";

            }

            else if (best.score >= 85) {

                document.getElementById(
                    "result-message"
                ).innerText =
                    "👍 とても良い写真です！";

            }

            else {

                document.getElementById(
                    "result-message"
                ).innerText =
                    "📐 もう少し角度を調整するとさらに良くなります。";

            }


            document.getElementById(
                "result"
            ).style.display =
                "flex";

        }


        /*
         * ビデオから写真を作る
         */

        function capturePhoto() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const ctx =
                canvas.getContext("2d");


            /*
             * 鏡と同じように左右反転
             */

            ctx.translate(
                canvas.width,
                0
            );

            ctx.scale(-1, 1);


            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            return canvas.toDataURL(
                "image/jpeg",
                0.9
            );

        }


        /*
         * 待機
         */

        function sleep(ms) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );

        }


        /*
         * 結果を閉じる
         */

        function closeResult() {

            document.getElementById(
                "result"
            ).style.display =
                "none";

        }


        /*
         * 起動
         */

        initCamera();

    </script>

</body>
</html>
